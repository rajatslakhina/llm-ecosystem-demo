<text x="96" y="24" fill="#8b95a3" font-size="12.5">swift&#160;run&#160;LLMEcosystemDemo</text>
<text x="26" y="62" fill="#ffffff" font-size="13.5" xml:space="preserve">==&#160;LLM&#160;Ecosystem&#160;Integration&#160;Demo&#160;==</text>
<text x="26" y="81" fill="#8b95a3" font-size="13.5" xml:space="preserve">ProviderGatewayKit&#160;(routing)&#160;+&#160;StructuredOutputKit&#160;(decoding)&#160;+&#160;TokenMeterKit&#160;(cost)&#160;+&#160;ResponseCacheKit&#160;(caching)&#160;+&#160;ToolRegistryKit&#160;(tool&#160;dispatch)&#160;+&#160;AgentLoopKit&#160;(agent</text>
<text x="26" y="100" fill="#8b95a3" font-size="13.5" xml:space="preserve">&#160;&#160;loop)&#160;+&#160;GuardrailKit&#160;(PII&#160;redaction&#160;&amp;&#160;policy)&#160;+&#160;TraceKit&#160;(tracing&#160;&amp;&#160;eval&#160;gates)&#160;+&#160;RetrievalKit&#160;(retrieval-augmented&#160;context)&#160;+&#160;PromptTemplateKit&#160;(prompt&#160;templating&#160;&amp;</text>
<text x="26" y="119" fill="#8b95a3" font-size="13.5" xml:space="preserve">&#160;&#160;rollback)&#160;+&#160;RetryPolicyKit&#160;(rate&#160;limiting&#160;&amp;&#160;retry&#160;policy)&#160;+&#160;ContextCompactionKit&#160;(conversation&#160;compaction&#160;under&#160;a&#160;token&#160;budget)&#160;+&#160;AgentMemoryKit&#160;(long-term&#160;write/recall</text>
<text x="26" y="138" fill="#8b95a3" font-size="13.5" xml:space="preserve">&#160;&#160;memory&#160;across&#160;sessions)&#160;+&#160;SemanticRouterKit&#160;(semantic&#160;intent&#160;routing&#160;by&#160;embedding&#160;distance)&#160;+&#160;OutputRepairKit&#160;(bounded&#160;self-healing&#160;structured-output&#160;repair&#160;loop)&#160;+</text>
<text x="26" y="157" fill="#8b95a3" font-size="13.5" xml:space="preserve">&#160;&#160;StreamAggregatorKit&#160;(streamed&#160;delta&#160;+&#160;tool-call&#160;fragment&#160;reassembly)&#160;+&#160;BatchInferenceKit&#160;(bounded-concurrency&#160;batch&#160;fan-out&#160;with&#160;per-item&#160;failure&#160;isolation)&#160;+</text>
<text x="26" y="176" fill="#8b95a3" font-size="13.5" xml:space="preserve">&#160;&#160;RealtimeSessionKit&#160;(a&#160;realtime&#160;session&#160;that&#160;survives&#160;a&#160;reconnect:&#160;at-least-once&#160;outbox,&#160;strict&#160;inbound&#160;ordering,&#160;two-layer&#160;dedup)&#160;+&#160;IdempotencyKit&#160;(at-most-once&#160;side</text>
<text x="26" y="195" fill="#8b95a3" font-size="13.5" xml:space="preserve">&#160;&#160;effects&#160;under&#160;at-least-once&#160;delivery)&#160;+&#160;SchemaMigrationKit&#160;(versioned&#160;contracts:&#160;migrate&#160;a&#160;payload&#160;across&#160;schema&#160;versions,&#160;validated&#160;at&#160;every&#160;hop)&#160;+&#160;ToolAuthorityKit</text>
<text x="26" y="214" fill="#8b95a3" font-size="13.5" xml:space="preserve">&#160;&#160;(deny-by-default&#160;authority&#160;for&#160;agent&#160;tool&#160;calls:&#160;capability&#160;scoping,&#160;a&#160;provenance&#160;ceiling,&#160;and&#160;approvals&#160;bound&#160;to&#160;one&#160;exact&#160;call)&#160;+&#160;GroundingKit&#160;(claim-level&#160;grounding</text>
<text x="26" y="233" fill="#8b95a3" font-size="13.5" xml:space="preserve">&#160;&#160;and&#160;citation&#160;verification:&#160;a&#160;verdict&#160;per&#160;sentence&#160;with&#160;the&#160;source&#160;span&#160;that&#160;proves&#160;it)&#160;+&#160;QuotaGovernorKit&#160;(hierarchical&#160;reserve/settle&#160;budget&#160;governance:&#160;hold&#160;an&#160;estimate</text>
<text x="26" y="252" fill="#8b95a3" font-size="13.5" xml:space="preserve">&#160;&#160;before&#160;the&#160;hop,&#160;settle&#160;it&#160;against&#160;the&#160;metered&#160;cost,&#160;refuse&#160;the&#160;next&#160;one)&#160;+&#160;CostEstimatorKit&#160;(where&#160;that&#160;estimate&#160;comes&#160;from:&#160;forecast&#160;a&#160;loop's&#160;cost&#160;before&#160;it&#160;runs&#160;from</text>
<text x="26" y="271" fill="#8b95a3" font-size="13.5" xml:space="preserve">&#160;&#160;transcript&#160;growth,&#160;tools,&#160;cache&#160;and&#160;retries,&#160;then&#160;reconcile&#160;against&#160;the&#160;metered&#160;actual)</text>
